<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Post - Base.Tube Blog</title>
    <script>
        // Extract slug from current URL and redirect to main blog page
        const path = window.location.pathname;
        const slug = path.split('/').pop().replace('.html', '');
        
        if (slug && slug !== '404') {
            // Try to load as a blog post
            window.location.replace('/blog/#' + slug);
        } else {
            // Redirect to main blog
            window.location.replace('/blog/');
        }
    </script>
</head>
<body>
    <p>Loading post...</p>
</body>
</html>
